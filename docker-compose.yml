name: openteam-dev

x-aiteamos-labels: &aiteamos-labels
  com.aiteamos.environment: development

services:
  postgres:
    labels: *aiteamos-labels
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: aiteamos
      POSTGRES_USER: aiteamos
      POSTGRES_PASSWORD: aiteamos-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiteamos -d aiteamos"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - aiteamos_postgres:/var/lib/postgresql/data

  migrate:
    labels: *aiteamos-labels
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://aiteamos:aiteamos-local-only@postgres:5432/aiteamos
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-data-init:
    labels: *aiteamos-labels
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /sand-data && chmod 0700 /sand-data"]
    restart: "no"
    volumes:
      - aiteamos_agent_data:/sand-data

  asset-store-init:
    labels: *aiteamos-labels
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /asset-store && chmod 0700 /asset-store"]
    restart: "no"
    volumes:
      - aiteamos_assets:/asset-store

  computer-home-init:
    labels: *aiteamos-labels
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - sh
      - -c
      - >-
        chown -R 1000:1000 /home/box && chmod 0700 /home/box &&
        if [ ! -L /home/box/agent-data ]; then ln -s /home/box/sand-data /home/box/agent-data; fi &&
        chown -h 0:0 /home/box/agent-data &&
        if [ -d /home/box/.pi/agent ]; then
          chown -R 0:0 /home/box/.pi/agent && chmod 0700 /home/box/.pi/agent &&
          find /home/box/.pi/agent -maxdepth 1 -type f \( -name auth.json -o -name models.json \) -exec chmod 0600 {} +;
        fi
    restart: "no"
    volumes:
      - aiteamos_computer_home:/home/box
      - aiteamos_agent_data:/home/box/sand-data

  box-store-init:
    labels: *aiteamos-labels
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /box-store && chmod 0700 /box-store"]
    restart: "no"
    volumes:
      - aiteamos_box_store:/box-store

  workspace-init:
    labels: *aiteamos-labels
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /workspace && chmod 0755 /workspace"]
    restart: "no"
    volumes:
      - aiteamos_workspace:/workspace

  computer:
    labels: *aiteamos-labels
    build:
      context: .
      dockerfile: docker/computer.Dockerfile
    cgroup: private
    # Shutdown closes bot browsers and saves their profiles before exiting.
    stop_grace_period: 30s
    mem_limit: ${AITEAMOS_COMPUTER_MEMORY_LIMIT:-12g}
    memswap_limit: ${AITEAMOS_COMPUTER_MEMORY_LIMIT:-12g}
    hostname: aiteamos
    environment:
      AITEAMOS_DESKTOP_MEMORY_LIMIT: ${AITEAMOS_DESKTOP_MEMORY_LIMIT:-10g}
      AITEAMOS_COMPUTER_PORT: 8790
      AITEAMOS_CONTROL_TOKEN: ${AITEAMOS_CONTROL_TOKEN:-local-compose-only-change-me}
      AITEAMOS_WORKSPACE_ROOT: /workspace
      AITEAMOS_SERVER_URL: http://server:8787
      AITEAMOS_PI_AGENT_DIR: /home/box/.pi/agent
      AITEAMOS_AGENT_DATA_ROOT: /home/box/agent-data
      AITEAMOS_AGENT_DATA_CANONICAL_ROOT: /home/box/sand-data
      AITEAMOS_BOX_STORE_ROOT: /box-store
      AITEAMOS_BOX_COPY_IN: ${AITEAMOS_BOX_COPY_IN:-0}
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      computer-home-init:
        condition: service_completed_successfully
      box-store-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    cap_add: ["ALL"]
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label:disable
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "/usr/lib/aiteamos/bin/bun", "-e", "const r=await fetch('http://127.0.0.1:8790/health');process.exit(r.ok?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    ports:
      - "127.0.0.1:6200-6299:6200-6299"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aiteamos_computer_home:/home/box
      - aiteamos_agent_data:/home/box/sand-data
      - aiteamos_workspace:/workspace
      - aiteamos_box_store:/box-store
      # Bots' system-wide installs (sudo pip and npm -g, make install, copied tools) and the record of their apt packages.
      - aiteamos_computer_local:/usr/local

  computer-memory-init:
    labels: *aiteamos-labels
    build:
      context: .
      dockerfile: docker/computer.Dockerfile
    entrypoint: ["/usr/lib/aiteamos/bin/aiteamos-memory-init"]
    pid: service:computer
    network_mode: none
    depends_on:
      computer:
        condition: service_started
    cap_drop: ["ALL"]
    cap_add: ["SYS_ADMIN", "SYS_CHROOT", "SYS_PTRACE"]
    security_opt:
      - no-new-privileges:true
      # Only the bootstrap helper enters the computer's mount namespace.
      # It drops all capabilities immediately after configuring memory controls.
      - apparmor:unconfined
    read_only: true
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 16
    restart: unless-stopped

  server:
    labels: *aiteamos-labels
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: server
    environment:
      AITEAMOS_VERSION: ${AITEAMOS_VERSION:-0.0.0+dev}
      AITEAMOS_UPDATE_CHANNEL: ${AITEAMOS_UPDATE_CHANNEL:-beta}
      DATABASE_URL: postgresql://aiteamos:aiteamos-local-only@postgres:5432/aiteamos
      AITEAMOS_PORT: 8787
      AITEAMOS_COMPUTER_URL: http://computer:8790
      AITEAMOS_CONTROL_TOKEN: ${AITEAMOS_CONTROL_TOKEN:-local-compose-only-change-me}
      AITEAMOS_AUTH_SECRET: ${AITEAMOS_AUTH_SECRET:-local-compose-auth-secret-change-me-now}
      AITEAMOS_AUTH_MODE: ${AITEAMOS_AUTH_MODE:-required}
      AITEAMOS_WORKSPACE_ROOT: /workspace
      AITEAMOS_SCREEN_VIEWER_HOST: 127.0.0.1
      AITEAMOS_AGENT_DATA_ROOT: /home/box/agent-data
      AITEAMOS_ASSET_ROOT: /asset-store
      AITEAMOS_MARKETPLACE_FILE: ${AITEAMOS_MARKETPLACE_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/v0/health');const b=await r.json();process.exit(r.ok&&b.status==='ready'?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - aiteamos_agent_data:/home/box/agent-data
      - aiteamos_assets:/asset-store
      - aiteamos_workspace:/workspace:ro

  worker:
    labels: *aiteamos-labels
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://aiteamos:aiteamos-local-only@postgres:5432/aiteamos
      AITEAMOS_COMPUTER_URL: http://computer:8790
      AITEAMOS_CONTROL_TOKEN: ${AITEAMOS_CONTROL_TOKEN:-local-compose-only-change-me}
      AITEAMOS_AUTH_MODE: ${AITEAMOS_AUTH_MODE:-required}
      AITEAMOS_APNS_KEY_ID: ${AITEAMOS_APNS_KEY_ID:-}
      AITEAMOS_APNS_TEAM_ID: ${AITEAMOS_APNS_TEAM_ID:-}
      AITEAMOS_APNS_TOPIC: ${AITEAMOS_APNS_TOPIC:-dev.openteam.mobile.swift}
      AITEAMOS_APNS_PRIVATE_KEY: ${AITEAMOS_APNS_PRIVATE_KEY:-}
      AITEAMOS_WORKER_CONCURRENCY: ${AITEAMOS_WORKER_CONCURRENCY:-8}
      AITEAMOS_WORKSPACE_ROOT: /workspace
      AITEAMOS_AGENT_DATA_ROOT: /home/box/agent-data
      AITEAMOS_ASSET_ROOT: /asset-store
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 12s
      start_period: 45s
      retries: 3
    # pg-boss waits up to 30 s for running jobs before the worker exits.
    stop_grace_period: 45s
    restart: unless-stopped
    volumes:
      - aiteamos_agent_data:/home/box/agent-data
      - aiteamos_assets:/asset-store
      - aiteamos_workspace:/workspace:ro

volumes:
  aiteamos_postgres:
  aiteamos_computer_home:
  aiteamos_computer_local:
  aiteamos_agent_data:
  aiteamos_assets:
  aiteamos_workspace:
  aiteamos_box_store:
