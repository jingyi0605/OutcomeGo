name: outcomego

x-outcomego-labels: &outcomego-labels
  com.outcomego.environment: production

x-outcomego-logging: &outcomego-logging
  driver: json-file
  options:
    max-size: "${OUTCOMEGO_LOG_MAX_SIZE:-10m}"
    max-file: "${OUTCOMEGO_LOG_MAX_FILES:-3}"

services:
  postgres:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: outcomego
      POSTGRES_USER: outcomego
      POSTGRES_PASSWORD: ${OUTCOMEGO_POSTGRES_PASSWORD:?OUTCOMEGO_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcomego -d outcomego"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - outcomego_postgres:/var/lib/postgresql/data

  migrate:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: ${OUTCOMEGO_IMAGE_PREFIX:?OUTCOMEGO_IMAGE_PREFIX is required}-migrate:${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
    environment:
      DATABASE_URL: postgresql://outcomego:${OUTCOMEGO_POSTGRES_PASSWORD}@postgres:5432/outcomego
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-data-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /sand-data && chmod 0700 /sand-data"]
    restart: "no"
    volumes:
      - outcomego_agent_data:/sand-data

  asset-store-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /asset-store && chmod 0700 /asset-store"]
    restart: "no"
    volumes:
      - outcomego_assets:/asset-store

  computer-home-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - sh
      - -c
      - >-
        chown -R 1000:1000 /home/box && chmod 0700 /home/box &&
        if [ ! -L /home/box/agent-data ]; then ln -s /home/box/sand-data /home/box/agent-data; fi &&
        chown -h 0:0 /home/box/agent-data
    restart: "no"
    volumes:
      - outcomego_computer_home:/home/box
      - outcomego_agent_data:/home/box/sand-data

  box-store-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /box-store && chmod 0700 /box-store"]
    restart: "no"
    volumes:
      - outcomego_box_store:/box-store

  workspace-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command: ["sh", "-c", "chown -R 1000:1000 /workspace && chmod 0755 /workspace"]
    restart: "no"
    volumes:
      - outcomego_workspace:/workspace

  computer:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: ${OUTCOMEGO_IMAGE_PREFIX:?OUTCOMEGO_IMAGE_PREFIX is required}-computer:${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
    cgroup: private
    # Shutdown closes bot browsers and saves their profiles before exiting.
    stop_grace_period: 30s
    mem_limit: ${OUTCOMEGO_COMPUTER_MEMORY_LIMIT:-12g}
    memswap_limit: ${OUTCOMEGO_COMPUTER_MEMORY_LIMIT:-12g}
    hostname: outcomego
    environment:
      OUTCOMEGO_DESKTOP_MEMORY_LIMIT: ${OUTCOMEGO_DESKTOP_MEMORY_LIMIT:-10g}
      OUTCOMEGO_COMPUTER_PORT: 8790
      OUTCOMEGO_CONTROL_TOKEN: ${OUTCOMEGO_CONTROL_TOKEN:?OUTCOMEGO_CONTROL_TOKEN is required}
      OUTCOMEGO_WORKSPACE_ROOT: /workspace
      OUTCOMEGO_SERVER_URL: http://server:8787
      OUTCOMEGO_PI_AGENT_DIR: /home/box/.pi/agent
      OUTCOMEGO_AGENT_DATA_ROOT: /home/box/agent-data
      OUTCOMEGO_AGENT_DATA_CANONICAL_ROOT: /home/box/sand-data
      OUTCOMEGO_BOX_STORE_ROOT: /box-store
      OUTCOMEGO_BOX_COPY_IN: ${OUTCOMEGO_BOX_COPY_IN:-0}
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      computer-home-init:
        condition: service_completed_successfully
      box-store-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    cap_add: ["ALL"]
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label:disable
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "/usr/lib/outcomego/bin/bun", "-e", "const r=await fetch('http://127.0.0.1:8790/health');process.exit(r.ok?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    ports:
      - "${OUTCOMEGO_VIEWER_BIND_HOST:-127.0.0.1}:${OUTCOMEGO_VIEWER_PORT_START:-6200}-${OUTCOMEGO_VIEWER_PORT_END:-6299}:6200-6299"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - outcomego_computer_home:/home/box
      - outcomego_agent_data:/home/box/sand-data
      - outcomego_workspace:/workspace
      - outcomego_box_store:/box-store
      # Bots' system-wide installs (sudo pip and npm -g, make install, copied tools) and the record of their apt packages.
      - outcomego_computer_local:/usr/local

  computer-memory-init:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: ${OUTCOMEGO_IMAGE_PREFIX:?OUTCOMEGO_IMAGE_PREFIX is required}-computer:${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
    entrypoint: ["/usr/lib/outcomego/bin/outcomego-memory-init"]
    pid: service:computer
    network_mode: none
    depends_on:
      computer:
        condition: service_started
    cap_drop: ["ALL"]
    cap_add: ["SYS_ADMIN", "SYS_CHROOT", "SYS_PTRACE"]
    security_opt:
      - no-new-privileges:true
      # Only the bootstrap helper enters the computer's mount namespace.
      # It drops all capabilities immediately after configuring memory controls.
      - apparmor:unconfined
    read_only: true
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 16
    restart: unless-stopped

  server:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: ${OUTCOMEGO_IMAGE_PREFIX:?OUTCOMEGO_IMAGE_PREFIX is required}-server:${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
    environment:
      OUTCOMEGO_VERSION: ${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
      OUTCOMEGO_UPDATE_CHANNEL: ${OUTCOMEGO_UPDATE_CHANNEL:-stable}
      DATABASE_URL: postgresql://outcomego:${OUTCOMEGO_POSTGRES_PASSWORD}@postgres:5432/outcomego
      OUTCOMEGO_PORT: 8787
      OUTCOMEGO_COMPUTER_URL: http://computer:8790
      OUTCOMEGO_CONTROL_TOKEN: ${OUTCOMEGO_CONTROL_TOKEN:?OUTCOMEGO_CONTROL_TOKEN is required}
      OUTCOMEGO_AUTH_SECRET: ${OUTCOMEGO_AUTH_SECRET:?OUTCOMEGO_AUTH_SECRET is required}
      OUTCOMEGO_PROXY_SECRET: ${OUTCOMEGO_PROXY_SECRET:?OUTCOMEGO_PROXY_SECRET is required}
      OUTCOMEGO_AUTH_MODE: ${OUTCOMEGO_AUTH_MODE:-required}
      OUTCOMEGO_ACCESS_MODE: ${OUTCOMEGO_ACCESS_MODE:-local}
      OUTCOMEGO_AUTH_URL: ${OUTCOMEGO_AUTH_URL:-http://127.0.0.1:8787}
      OUTCOMEGO_PUBLIC_URL: ${OUTCOMEGO_PUBLIC_URL:-http://127.0.0.1:8787}
      OUTCOMEGO_WORKSPACE_ROOT: /workspace
      OUTCOMEGO_SCREEN_VIEWER_HOST: ${OUTCOMEGO_PUBLIC_HOST:-127.0.0.1}
      OUTCOMEGO_AGENT_DATA_ROOT: /home/box/agent-data
      OUTCOMEGO_ASSET_ROOT: /asset-store
      OUTCOMEGO_MARKETPLACE_FILE: ${OUTCOMEGO_MARKETPLACE_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    ports:
      - "${OUTCOMEGO_BIND_HOST:-127.0.0.1}:${OUTCOMEGO_API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/v0/health');const b=await r.json();process.exit(r.ok&&b.status==='ready'?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - outcomego_agent_data:/home/box/agent-data
      - outcomego_assets:/asset-store
      - outcomego_workspace:/workspace:ro

  caddy:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: ["https"]
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${OUTCOMEGO_PUBLIC_URL:?OUTCOMEGO_PUBLIC_URL is required}
      - --to
      - server:8787
      - --header-up
      - "X-outcomeGo-Proxy: ${OUTCOMEGO_PROXY_SECRET:?OUTCOMEGO_PROXY_SECRET is required}"
      - --header-down
      - "Strict-Transport-Security: max-age=31536000"
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - outcomego_caddy_data:/data
      - outcomego_caddy_config:/config

  worker:
    labels: *outcomego-labels
    logging: *outcomego-logging
    image: ${OUTCOMEGO_IMAGE_PREFIX:?OUTCOMEGO_IMAGE_PREFIX is required}-worker:${OUTCOMEGO_VERSION:?OUTCOMEGO_VERSION is required}
    environment:
      DATABASE_URL: postgresql://outcomego:${OUTCOMEGO_POSTGRES_PASSWORD}@postgres:5432/outcomego
      OUTCOMEGO_COMPUTER_URL: http://computer:8790
      OUTCOMEGO_CONTROL_TOKEN: ${OUTCOMEGO_CONTROL_TOKEN:?OUTCOMEGO_CONTROL_TOKEN is required}
      OUTCOMEGO_AUTH_MODE: ${OUTCOMEGO_AUTH_MODE:-required}
      OUTCOMEGO_APNS_KEY_ID: ${OUTCOMEGO_APNS_KEY_ID:-}
      OUTCOMEGO_APNS_TEAM_ID: ${OUTCOMEGO_APNS_TEAM_ID:-}
      OUTCOMEGO_APNS_TOPIC: ${OUTCOMEGO_APNS_TOPIC:-dev.outcomego.mobile}
      OUTCOMEGO_APNS_PRIVATE_KEY: ${OUTCOMEGO_APNS_PRIVATE_KEY:-}
      OUTCOMEGO_WORKER_CONCURRENCY: ${OUTCOMEGO_WORKER_CONCURRENCY:-8}
      OUTCOMEGO_WORKSPACE_ROOT: /workspace
      OUTCOMEGO_AGENT_DATA_ROOT: /home/box/agent-data
      OUTCOMEGO_ASSET_ROOT: /asset-store
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 12s
      start_period: 45s
      retries: 3
    # pg-boss waits up to 30 s for running jobs before the worker exits.
    stop_grace_period: 45s
    restart: unless-stopped
    volumes:
      - outcomego_agent_data:/home/box/agent-data
      - outcomego_assets:/asset-store
      - outcomego_workspace:/workspace:ro

volumes:
  outcomego_postgres:
  outcomego_computer_home:
  outcomego_computer_local:
  outcomego_agent_data:
  outcomego_assets:
  outcomego_workspace:
  outcomego_box_store:
  outcomego_caddy_data:
  outcomego_caddy_config:
