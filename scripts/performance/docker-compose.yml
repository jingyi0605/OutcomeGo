name: outcomego-performance-audit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: outcomego_perf_audit
      POSTGRES_USER: outcomego
      POSTGRES_PASSWORD: outcomego-perf-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcomego -d outcomego_perf_audit"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: docker/app.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://outcomego:outcomego-perf-local-only@postgres:5432/outcomego_perf_audit
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-data-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /agent-data && chmod 0700 /agent-data"]
    restart: "no"
    volumes:
      - agent-data:/agent-data

  asset-store-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /asset-store && chmod 0700 /asset-store"]
    restart: "no"
    volumes:
      - asset-store:/asset-store

  computer:
    image: oven/bun:1.4.2-slim
    command: ["bun", "/audit/stub-computer.ts"]
    environment:
      OUTCOMEGO_COMPUTER_PORT: 8790
    volumes:
      - ./stub-computer.ts:/audit/stub-computer.ts:ro

  server:
    build:
      context: ../..
      dockerfile: docker/app.Dockerfile
      target: server
    environment:
      DATABASE_URL: postgresql://outcomego:outcomego-perf-local-only@postgres:5432/outcomego_perf_audit
      OUTCOMEGO_PORT: 8787
      OUTCOMEGO_COMPUTER_URL: http://computer:8790
      OUTCOMEGO_CONTROL_TOKEN: performance-audit-local-only
      OUTCOMEGO_AUTH_SECRET: performance-audit-auth-secret-local-only
      OUTCOMEGO_AUTH_MODE: disabled
      OUTCOMEGO_WORKSPACE_ROOT: /workspace
      OUTCOMEGO_AGENT_DATA_ROOT: /home/outcomego/agent-data
      OUTCOMEGO_ASSET_ROOT: /asset-store
      OUTCOMEGO_SCREEN_VIEWER_HOST: 127.0.0.1
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8877:8787"
    volumes:
      - agent-data:/home/outcomego/agent-data
      - asset-store:/asset-store

volumes:
  agent-data:
  asset-store:
  postgres-data:
