<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Word, WPS and Excel documents from mainland China name Windows/macOS fonts
  that the image cannot ship (SimSun, Microsoft YaHei, ...). Map each name to
  an installed free font so LibreOffice renders and exports with the intended
  style (serif, sans, kai, fang-song) instead of an arbitrary fallback.
-->
<fontconfig>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>新宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>STSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Songti SC</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong_GB2312</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋_GB2312</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>

  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei UI</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>STHeiti</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>PingFang SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>

  <alias binding="same">
    <family>KaiTi</family>
    <prefer><family>AR PL UKai CN</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体</family>
    <prefer><family>AR PL UKai CN</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi_GB2312</family>
    <prefer><family>AR PL UKai CN</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体_GB2312</family>
    <prefer><family>AR PL UKai CN</family></prefer>
  </alias>
  <alias binding="same">
    <family>STKaiti</family>
    <prefer><family>AR PL UKai CN</family></prefer>
  </alias>
</fontconfig>
