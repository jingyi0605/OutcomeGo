name: Release

# Pushing a tag `v<version>` (for example v0.1.0-beta.1) builds and publishes every artifact to one
# GitHub Release: server images (GHCR), digest-pinned Compose file, CLI binaries, signatures,
# installers, desktop apps and the Android APK. The tag must equal the version in package.json
# (`bun scripts/release/version.ts set <version>` keeps every file in sync).
#
# Running the workflow from a branch (workflow_dispatch) is a dry run: everything is built and the
# artifacts can be downloaded from the run, but nothing is pushed, signed or published.
#
# This file must keep its name. The CLI only trusts signatures whose certificate identity is
# `.github/workflows/release.yml@refs/tags/v<version>` (apps/cli/src/release.ts).
#
# Optional platforms are switched on with repository variables once their secrets exist:
#   RELEASE_ANDROID=true  RELEASE_MACOS=true  RELEASE_IOS=true
# See .github/RELEASING.md for the secrets each one needs.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: v
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bun scripts/release/version.ts check --tag "$GITHUB_REF_NAME"
            publish=true
          else
            bun scripts/release/version.ts check
            publish=false
          fi
          prefix="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/outcomego"
          # The CLI downloads from, and verifies signatures for, the repository and image prefix
          # compiled into it. A mismatch would publish a release the CLI cannot install.
          grep -q "\"$GITHUB_REPOSITORY\"" apps/cli/src/constants.ts \
            || { echo "DEFAULT_REPOSITORY in apps/cli/src/constants.ts is not $GITHUB_REPOSITORY" >&2; exit 1; }
          grep -q "\"$prefix\"" apps/cli/src/constants.ts \
            || { echo "DEFAULT_IMAGE_PREFIX in apps/cli/src/constants.ts is not $prefix" >&2; exit 1; }
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "image_prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      run_docker: false

  # ── Server images ────────────────────────────────────────────────────────────
  # Each architecture builds natively and is pushed by digest; merge-images joins them.
  images:
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker, migrate, computer]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { image: server, file: docker/app.Dockerfile, target: server }
          - { image: worker, file: docker/app.Dockerfile, target: worker }
          - { image: migrate, file: docker/app.Dockerfile, target: migrate }
          - { image: computer, file: docker/computer.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        if: matrix.image == 'computer'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Resolve reusable image and Computer base
        id: inputs
        env:
          IMAGE: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }}
          PREFIX: ${{ needs.meta.outputs.image_prefix }}
          KIND: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
        run: |
          set -euo pipefail
          input_hash=$(bun scripts/release/image-inputs.ts "$KIND")
          input_ref="$IMAGE:inputs-$input_hash-$ARCH"
          digest=""
          # A missing/expired registry record is a cache miss, never a release failure.
          if [ "$PUBLISH" = true ]; then
            digest=$(docker buildx imagetools inspect "$input_ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest' || true)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || digest=""
          base_ref=computer-base
          base_tag=""
          if [ "$KIND" = computer ] && [ -z "$digest" ]; then
            base_hash=$(bun scripts/release/image-inputs.ts computer-base)
            base_tag="$PREFIX-computer-base:inputs-$base_hash-$ARCH"
            base_digest=$(docker buildx imagetools inspect "$base_tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest' || true)
            if [[ "$base_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              base_ref="$PREFIX-computer-base@$base_digest"
            fi
          fi
          {
            echo "digest=$digest"
            echo "input_ref=$input_ref"
            echo "base_ref=$base_ref"
            echo "base_tag=$base_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Build the Computer base on a recipe cache miss
        id: base
        if: matrix.image == 'computer' && steps.inputs.outputs.digest == '' && steps.inputs.outputs.base_ref == 'computer-base' && needs.meta.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/computer.Dockerfile
          target: computer-base
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.inputs.outputs.base_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=computer-base-${{ matrix.arch }}
            type=gha,scope=computer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=computer-base-${{ matrix.arch }}
      - id: build
        if: steps.inputs.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            COMPUTER_BASE=${{ steps.base.outputs.digest != '' && format('{0}-computer-base@{1}', needs.meta.outputs.image_prefix, steps.base.outputs.digest) || steps.inputs.outputs.base_ref }}
          # Plain per-architecture images, so the merged index has no attestation entries.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ needs.meta.outputs.publish }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record or reuse the immutable digest
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.inputs.outputs.digest || steps.build.outputs.digest }}
          REUSED: ${{ steps.inputs.outputs.digest != '' }}
          INPUT_REF: ${{ steps.inputs.outputs.input_ref }}
          IMAGE: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }}
          KIND: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest: $DIGEST" >&2; exit 1; }
          if [ "$REUSED" != true ]; then
            docker buildx imagetools create --prefer-index=false -t "$INPUT_REF" "$IMAGE@$DIGEST"
          fi
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
          echo "| $KIND | $ARCH | $DIGEST | reused=$REUSED |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REUSED" = true ]; then
            echo "Reused images retain their original OCI version and revision labels." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.meta.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    needs: [meta, ci, images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker, migrate, computer]
    env:
      IMAGE: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-architecture image
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -eq 2 ] || { echo "Expected one digest per architecture, found: $(ls)" >&2; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" $(printf "$IMAGE@sha256:%s " *)
      - name: Record the index digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected digest: $digest" >&2; exit 1; }
          mkdir out
          printf '%s\n' "$digest" > "out/outcomego-${{ matrix.image }}.digest"
          echo "$IMAGE@$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.image }}
          path: out/*.digest
          if-no-files-found: error

  verify-images:
    # Users pull these images anonymously. GHCR packages start private, so the first release
    # fails here until each package is set to public; then re-run the failed jobs.
    needs: [meta, merge-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Pull every image without credentials
        env:
          PREFIX: ${{ needs.meta.outputs.image_prefix }}
        run: |
          set -euo pipefail
          failed=0
          for image in server worker migrate computer; do
            digest=$(cat "digests/outcomego-$image.digest")
            if ! docker pull "$PREFIX-$image@$digest"; then
              echo "::error::Anonymous pull of $PREFIX-$image failed. Make the package public: ${GITHUB_SERVER_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages/container/outcomego-$image/settings"
              failed=1
            fi
          done
          exit $failed

  # ── CLI, Compose file and signatures ─────────────────────────────────────────
  cli-build:
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the five CLI binaries
        run: bun run build:release
        working-directory: apps/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: apps/cli/release/*
          if-no-files-found: error
          retention-days: 7

  windows-engine:
    if: vars.RELEASE_WINDOWS_ENGINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify approved inputs and stage Windows rootfs
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/windows-engine"
          mkdir "$stage"
          docker buildx build --platform linux/amd64 \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --file apps/cli/engine-assets/windows-x64.Dockerfile \
            --output "type=tar,dest=$stage/rootfs.tar" apps/cli/engine-assets
          sudo "$(command -v bun)" apps/cli/scripts/engine-assets.ts --windows-rootfs "$stage/rootfs.tar" "$stage/staged"
          sudo chown -R "$(id -u):$(id -g)" "$stage/staged"
          bun scripts/check/release-workflows.ts --engine-components "$stage/staged/engine-components.json"
          asset="$stage/staged/outcomego-engine-windows-x64.tar.gz"
          test "$(stat -c %s "$asset")" -le "$((768 * 1024 * 1024))"
          mkdir -p dist/windows-engine
          cp "$asset" "$stage/staged/engine-components.json" THIRD-PARTY-NOTICES dist/windows-engine/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-engine
          path: dist/windows-engine/*
          if-no-files-found: error
          retention-days: 7

  macos-engine:
    if: vars.RELEASE_MACOS == 'true'
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: arm64, runner: macos-15, primary: true }
          - { architecture: x64, runner: macos-15-intel, primary: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Restore macOS engine signing credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_keychain="$RUNNER_TEMP/OutcomeGo-engine-signing.keychain-db"
          signing_keychain_password="$(openssl rand -hex 32)"
          signing_certificate="$RUNNER_TEMP/OutcomeGo-engine-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$signing_certificate"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$signing_certificate" \
            -k "$signing_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$signing_keychain" $existing_keychains
          echo "CSC_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
      - name: Build and sign the macOS engine assets
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/macos-engine-${{ matrix.architecture }}"
          bun apps/cli/scripts/build-macos-engine.ts "${{ matrix.architecture }}" "$stage"
          bun scripts/check/release-workflows.ts --engine-components "$stage/engine-components-macos.json" --section macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-engine-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/macos-engine-${{ matrix.architecture }}/outcomego-engine-darwin-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.primary
        with:
          name: macos-engine-components
          path: ${{ runner.temp }}/macos-engine-${{ matrix.architecture }}/engine-components-macos.json
          if-no-files-found: error
          retention-days: 7

  sign:
    # The only job with an OIDC token. It runs just the signing script, so the Sigstore
    # certificate identity is this workflow on the release tag.
    needs: [meta, ci, cli-build, merge-images, windows-engine, macos-engine]
    if: >-
      ${{ !cancelled()
      && needs.meta.outputs.publish == 'true'
      && needs.ci.result == 'success'
      && needs.cli-build.result == 'success'
      && needs.merge-images.result == 'success'
      && (vars.RELEASE_WINDOWS_ENGINE != 'true' || needs.windows-engine.result == 'success')
      && (vars.RELEASE_MACOS != 'true' || needs.macos-engine.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: dist/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Render the digest-pinned Compose file and installers
        run: |
          bun scripts/render-release-compose.ts deploy/compose.yaml dist/core/outcomego-compose.yaml digests
          bun scripts/release/render-installers.ts dist/core
      - name: Sign the Compose file and the raw CLI binaries
        env:
          OUTCOMEGO_RELEASE_SIGNING_MODE: keyless
        run: |
          bun apps/cli/scripts/sign-release.ts \
            dist/core/outcomego-compose.yaml \
            dist/core/outcomego-darwin-arm64 \
            dist/core/outcomego-darwin-x64 \
            dist/core/outcomego-linux-arm64 \
            dist/core/outcomego-linux-x64 \
            dist/core/outcomego-windows-x64.exe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: vars.RELEASE_WINDOWS_ENGINE == 'true'
        with:
          name: windows-engine
          path: dist/core
      - name: Sign the Windows engine archive
        if: vars.RELEASE_WINDOWS_ENGINE == 'true'
        env:
          OUTCOMEGO_RELEASE_SIGNING_MODE: keyless
        run: bun apps/cli/scripts/sign-release.ts dist/core/outcomego-engine-windows-x64.tar.gz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: vars.RELEASE_MACOS == 'true'
        with:
          pattern: macos-engine-*
          path: dist/core
          merge-multiple: true
      - name: Include macOS engine notices
        if: vars.RELEASE_MACOS == 'true'
        run: cp THIRD-PARTY-NOTICES dist/core/THIRD-PARTY-NOTICES
      - name: Sign the macOS engine assets
        if: vars.RELEASE_MACOS == 'true'
        env:
          OUTCOMEGO_RELEASE_SIGNING_MODE: keyless
        run: |
          set -euo pipefail
          for asset in dist/core/outcomego-engine-darwin-*.tar.gz dist/core/outcomego-engine-darwin-*.qcow2; do
            [ -f "$asset" ] || continue
            bun apps/cli/scripts/sign-release.ts "$asset"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core
          path: dist/core/*
          if-no-files-found: error

  # ── Desktop ──────────────────────────────────────────────────────────────────
  desktop:
    needs: [meta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run prepare:plugins
      - name: Restore Windows Authenticode certificate
        if: runner.os == 'Windows' && needs.meta.outputs.publish == 'true'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ] || [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::Windows signing credentials are not configured; publishing an unsigned installer."
            exit 0
          fi
          certificate="$RUNNER_TEMP/OutcomeGo-windows-signing.pfx"
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          echo "WIN_CSC_LINK=$certificate" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
      - name: Package and check size budgets
        run: |
          for attempt in 1 2 3; do
            if bun run package; then
              exit 0
            fi
            echo "Desktop packaging attempt $attempt failed; retrying after a short delay." >&2
            sleep 15
          done
          exit 1
        working-directory: apps/desktop
      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && needs.meta.outputs.publish == 'true'
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            echo "Windows signing credentials are not configured; skipping Authenticode verification."
            exit 0
          fi
          test -n "$WINDOWS_SIGNING_SUBJECT" || {
            echo "WINDOWS_SIGNING_SUBJECT is required for published Windows releases" >&2
            exit 1
          }
          pwsh -File scripts/windows/verify-authenticode.ps1 \
            -Path apps/desktop/release \
            -SubjectPattern "$WINDOWS_SIGNING_SUBJECT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/OutcomeGo-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  macos:
    # Needs a Developer ID Application certificate and notarization key.
    needs: [meta]
    if: ${{ vars.RELEASE_MACOS == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: arm64, runner: macos-15 }
          - { architecture: x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run prepare:plugins
      - name: Restore macOS signing and notarization credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_keychain="$RUNNER_TEMP/OutcomeGo-signing.keychain-db"
          signing_keychain_password="$(openssl rand -hex 32)"
          signing_certificate="$RUNNER_TEMP/OutcomeGo-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$signing_certificate"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security import "$signing_certificate" \
            -k "$signing_keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$signing_keychain" $existing_keychains
          echo "CSC_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_NAME: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          xcrun actool --version
          bun run package:mac-release
      - name: Verify the disk image
        run: hdiutil verify "apps/desktop/release/OutcomeGo-*-mac-${{ matrix.architecture }}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macOS-${{ matrix.architecture }}
          path: |
            apps/desktop/release/OutcomeGo-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # ── Android ──────────────────────────────────────────────────────────────────
  android:
    needs: [meta]
    if: ${{ vars.RELEASE_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build and verify the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OUTCOMEGO_APP_LINK_HOST: ${{ vars.ANDROID_APP_LINK_HOST }}
        run: bash scripts/android/package-release.sh
      - name: Release gate (device, performance and Play checks stay pending)
        env:
          ANDROID_APK: apps/android/app/build/outputs/apk/release/androidApp-release.apk
        run: bash scripts/android/release-gate.sh all
      - name: Create signed Android update manifest
        env:
          ANDROID_UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.ANDROID_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          VERSION: ${{ needs.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPDATE_SIGNING_PRIVATE_KEY_BASE64" || {
            echo "ANDROID_UPDATE_SIGNING_PRIVATE_KEY_BASE64 is required for Android releases" >&2
            exit 1
          }
          apk="apps/android/app/build/outputs/apk/release/androidApp-release.apk"
          mkdir -p dist
          private_key="$RUNNER_TEMP/android-update-signing-key.pem"
          printf '%s' "$ANDROID_UPDATE_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(command -v apksigner || true)"
          if [ -z "$apksigner_path" ] && [ -n "$sdk_root" ]; then
            apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          test -x "$apksigner_path" || { echo "apksigner was not found" >&2; exit 1; }
          certificate_sha256="$($apksigner_path verify --print-certs "$apk" 2>&1 | sed -nE 's/.*SHA-256 digest:[[:space:]]*//p' | head -n 1)"
          test -n "$certificate_sha256" || { echo "Could not read the APK certificate digest" >&2; exit 1; }
          aapt2_path="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2_path" || { echo "aapt2 was not found" >&2; exit 1; }
          version_code="$("$aapt2_path" dump badging "$apk" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$version_code" || { echo "Could not read the APK version code" >&2; exit 1; }
          python3 scripts/android/create-update-manifest.py \
            --version "$VERSION" \
            --version-code "$version_code" \
            --application-id com.outcomego.android \
            --apk-url "$SERVER_URL/$REPOSITORY/releases/download/$REF_NAME/OutcomeGo-$VERSION-android.apk" \
            --apk "$apk" \
            --certificate-sha256 "$certificate_sha256" \
            --private-key "$private_key" \
            --output dist/android-update.json
      - name: Name the artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/androidApp-release.apk "dist/OutcomeGo-$VERSION-android.apk"
          test -s dist/android-update.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/android-update.json
          if-no-files-found: error

  # ── iOS (TestFlight upload; no file is attached to the GitHub Release) ───────
  ios:
    # Needs apps/ios/release.json to carry this fork's bundle identifier and team, plus the
    # signing secrets read by apps/ios/scripts/ci-testflight.sh. The project README asks for
    # Xcode 27.3 or later; set IOS_RUNNER / IOS_XCODE if the default image is too old.
    needs: [meta]
    if: ${{ vars.RELEASE_IOS == 'true' }}
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Select Xcode
        env:
          IOS_XCODE: ${{ vars.IOS_XCODE || 'Xcode_27.2.app' }}
        run: |
          sudo xcode-select -s "/Applications/$IOS_XCODE"
          xcodebuild -version
      - name: Refuse upstream identifiers, set a unique build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'apps/ios/release.json'
          release = json.load(open(path))
          assert release['bundleIdentifier'] == 'dev.outcomego.mobile', 'apps/ios/release.json must use this fork\'s bundle identifier'
          assert release['teamIdentifier'] == '828JR8JA8V', 'apps/ios/release.json must use this fork\'s Apple team'
          release['buildNumber'] = os.environ['BUILD_NUMBER']
          json.dump(release, open(path, 'w'), indent=2)
          PY
          python3 apps/ios/scripts/generate-project.py
          python3 apps/ios/scripts/check-native-config.py
      - name: Archive, sign and upload to App Store Connect
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash apps/ios/scripts/ci-testflight.sh

  # ── Publish ──────────────────────────────────────────────────────────────────
  publish:
    needs: [meta, ci, verify-images, sign, desktop, macos, android, ios]
    if: >-
      ${{ !cancelled()
      && needs.meta.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
      && needs.ci.result == 'success'
      && needs.verify-images.result == 'success'
      && needs.sign.result == 'success'
      && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core
          path: artifacts/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.android.result == 'success'
        with:
          name: android
          path: artifacts/android
      - name: Assemble the release files and checksums
        env:
          RELEASE_WINDOWS_ENGINE: ${{ vars.RELEASE_WINDOWS_ENGINE }}
          RELEASE_MACOS: ${{ vars.RELEASE_MACOS }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release-files
          # Only these artifacts are release files; digests and the unsigned CLI build are not.
          for directory in artifacts/core artifacts/desktop-* artifacts/android; do
            [ -d "$directory" ] && cp -n "$directory"/* release-files/
          done
          cd release-files
          for required in outcomego-compose.yaml outcomego-compose.yaml.sigstore.json install.sh outcomego-linux-x64.gz; do
            [ -f "$required" ] || { echo "Missing release file: $required" >&2; exit 1; }
          done
          if [ "$RELEASE_WINDOWS_ENGINE" = true ]; then
            for required in outcomego-engine-windows-x64.tar.gz outcomego-engine-windows-x64.tar.gz.sigstore.json engine-components.json THIRD-PARTY-NOTICES; do
              [ -s "$required" ] || { echo "Missing release file: $required" >&2; exit 1; }
            done
          fi
          if [ "$RELEASE_MACOS" = true ]; then
            mac_runtime=(outcomego-engine-darwin-*.tar.gz)
            mac_images=(outcomego-engine-darwin-*.qcow2)
            [ "${#mac_runtime[@]}" -eq 2 ] || { echo "Expected two macOS runtime assets" >&2; exit 1; }
            [ "${#mac_images[@]}" -eq 2 ] || { echo "Expected two macOS disk assets" >&2; exit 1; }
            for required in "${mac_runtime[@]}" "${mac_images[@]}" engine-components-macos.json THIRD-PARTY-NOTICES; do
              [ -s "$required" ] || { echo "Missing release file: $required" >&2; exit 1; }
            done
            for asset in "${mac_runtime[@]}" "${mac_images[@]}"; do
              [ -s "$asset.sigstore.json" ] || { echo "Missing release signature: $asset.sigstore.json" >&2; exit 1; }
            done
          fi
          if [ "${{ needs.android.result }}" = "success" ]; then
            [ -s android-update.json ] || {
              echo "Missing release file: android-update.json" >&2
              exit 1
            }
          fi
          desktop=(OutcomeGo-*-mac-* OutcomeGo-*-win-* OutcomeGo-*-linux-*)
          [ ${#desktop[@]} -gt 0 ] && sha256sum "${desktop[@]}" > DESKTOP_SHA256SUMS
          others=()
          for file in *; do
            case "$file" in
              SHA256SUMS|DESKTOP_SHA256SUMS|latest*.yml) continue ;;
            esac
            printf '%s\n' "${desktop[@]}" | grep -qxF -- "$file" || others+=("$file")
          done
          sha256sum "${others[@]}" > SHA256SUMS
          ls -l
      - name: Write the release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Windows 桌面端

          关闭窗口后，OutcomeGo 仍留在通知区域。点击托盘图标可重新打开窗口，右键选择“退出”可关闭应用。默认退出应用不停止本机服务。

          ## Install the server

          \`\`\`sh
          curl -fsSL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sh
          \`\`\`

          On Windows PowerShell:

          \`\`\`powershell
          irm ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.ps1 | iex
          \`\`\`

          Desktop installers and the Android APK are attached below. Checksums are in
          \`SHA256SUMS\` and \`DESKTOP_SHA256SUMS\`; the Compose file and CLI binaries carry
          Sigstore signatures (\`*.sigstore.json\`). Unchanged server images may reuse an
          earlier immutable digest and retain their original OCI version and revision labels;
          the signed Compose file pins the images selected for this release. The release source
          is tag \`${GITHUB_REF_NAME}\` of this repository (GPL-3.0-only).
          EOF
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        # Not marked as a pre-release: the installer, the CLI and the desktop updater all read
        # /releases/latest, which GitHub answers only with non-pre-release releases.
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "OutcomeGo $VERSION" \
            --notes-file notes.md \
            --generate-notes
