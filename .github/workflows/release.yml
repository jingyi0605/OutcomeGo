name: Release

# Pushing a tag `v<version>` (for example v0.1.0-beta.1) builds and publishes every artifact to one
# GitHub Release: server images (GHCR), digest-pinned Compose file, CLI binaries, signatures,
# installers, desktop apps and the Android APK. The tag must equal the version in package.json
# (`bun scripts/release/version.ts set <version>` keeps every file in sync).
#
# Running the workflow from a branch (workflow_dispatch) is a dry run: everything is built and the
# artifacts can be downloaded from the run, but nothing is pushed, signed or published.
#
# This file must keep its name. The CLI only trusts signatures whose certificate identity is
# `.github/workflows/release.yml@refs/tags/v<version>` (apps/cli/src/release.ts).
#
# Optional platforms are switched on with repository variables once their secrets exist:
#   RELEASE_ANDROID=true  RELEASE_MACOS=true  RELEASE_IOS=true
# See .github/RELEASING.md for the secrets each one needs.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: v
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bun scripts/release/version.ts check --tag "$GITHUB_REF_NAME"
            publish=true
          else
            bun scripts/release/version.ts check
            publish=false
          fi
          prefix="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ai-teamos"
          # The CLI downloads from, and verifies signatures for, the repository and image prefix
          # compiled into it. A mismatch would publish a release the CLI cannot install.
          grep -q "\"$GITHUB_REPOSITORY\"" apps/cli/src/constants.ts \
            || { echo "DEFAULT_REPOSITORY in apps/cli/src/constants.ts is not $GITHUB_REPOSITORY" >&2; exit 1; }
          grep -q "\"$prefix\"" apps/cli/src/constants.ts \
            || { echo "DEFAULT_IMAGE_PREFIX in apps/cli/src/constants.ts is not $prefix" >&2; exit 1; }
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "image_prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  # ── Server images ────────────────────────────────────────────────────────────
  # Each architecture builds natively and is pushed by digest; merge-images joins them.
  images:
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker, migrate, computer]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { image: server, file: docker/app.Dockerfile, target: server }
          - { image: worker, file: docker/app.Dockerfile, target: worker }
          - { image: migrate, file: docker/app.Dockerfile, target: migrate }
          - { image: computer, file: docker/computer.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        if: matrix.image == 'computer'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # Plain per-architecture images, so the merged index has no attestation entries.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ needs.meta.outputs.publish }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record digest
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.meta.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    needs: [meta, ci, images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker, migrate, computer]
    env:
      IMAGE: ${{ needs.meta.outputs.image_prefix }}-${{ matrix.image }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-architecture image
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -eq 2 ] || { echo "Expected one digest per architecture, found: $(ls)" >&2; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" $(printf "$IMAGE@sha256:%s " *)
      - name: Record the index digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected digest: $digest" >&2; exit 1; }
          mkdir out
          printf '%s\n' "$digest" > "out/aiteamos-${{ matrix.image }}.digest"
          echo "$IMAGE@$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.image }}
          path: out/*.digest
          if-no-files-found: error

  verify-images:
    # Users pull these images anonymously. GHCR packages start private, so the first release
    # fails here until each package is set to public; then re-run the failed jobs.
    needs: [meta, merge-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Pull every image without credentials
        env:
          PREFIX: ${{ needs.meta.outputs.image_prefix }}
        run: |
          set -euo pipefail
          failed=0
          for image in server worker migrate computer; do
            digest=$(cat "digests/aiteamos-$image.digest")
            if ! docker pull "$PREFIX-$image@$digest"; then
              echo "::error::Anonymous pull of $PREFIX-$image failed. Make the package public: ${GITHUB_SERVER_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages/container/ai-teamos-$image/settings"
              failed=1
            fi
          done
          exit $failed

  # ── CLI, Compose file and signatures ─────────────────────────────────────────
  cli-build:
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the five CLI binaries
        run: bun run build:release
        working-directory: apps/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: apps/cli/release/*
          if-no-files-found: error
          retention-days: 7

  sign:
    # The only job with an OIDC token. It runs just the signing script, so the Sigstore
    # certificate identity is this workflow on the release tag.
    needs: [meta, ci, cli-build, merge-images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: dist/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Render the digest-pinned Compose file and installers
        run: |
          bun scripts/render-release-compose.ts deploy/compose.yaml dist/core/aiteamos-compose.yaml digests
          bun scripts/release/render-installers.ts dist/core
      - name: Sign the Compose file and the raw CLI binaries
        env:
          AITEAMOS_RELEASE_SIGNING_MODE: keyless
        run: |
          bun apps/cli/scripts/sign-release.ts \
            dist/core/aiteamos-compose.yaml \
            dist/core/aiteamos-darwin-arm64 \
            dist/core/aiteamos-darwin-x64 \
            dist/core/aiteamos-linux-arm64 \
            dist/core/aiteamos-linux-x64 \
            dist/core/aiteamos-windows-x64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core
          path: dist/core/*
          if-no-files-found: error

  # ── Desktop ──────────────────────────────────────────────────────────────────
  desktop:
    needs: [meta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run prepare:plugins
      - name: Package and check size budgets
        run: |
          for attempt in 1 2 3; do
            if bun run package; then
              exit 0
            fi
            echo "Desktop packaging attempt $attempt failed; retrying after a short delay." >&2
            sleep 15
          done
          exit 1
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/aiTeamOS-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  macos:
    # Needs a Developer ID Application certificate and notarization key.
    needs: [meta]
    if: ${{ vars.RELEASE_MACOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run prepare:plugins
      - name: Restore the notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run package:mac-release
      - name: Verify the disk image
        run: hdiutil verify apps/desktop/release/aiTeamOS-*-mac-arm64.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macOS
          path: |
            apps/desktop/release/aiTeamOS-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  # ── Android ──────────────────────────────────────────────────────────────────
  android:
    needs: [meta]
    if: ${{ vars.RELEASE_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build and verify the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AITEAMOS_APP_LINK_HOST: ${{ vars.ANDROID_APP_LINK_HOST }}
        run: bash scripts/android/package-release.sh
      - name: Release gate (device, performance and Play checks stay pending)
        env:
          ANDROID_APK: apps/android/app/build/outputs/apk/release/androidApp-release.apk
        run: bash scripts/android/release-gate.sh all
      - name: Name the artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/androidApp-release.apk "dist/aiTeamOS-$VERSION-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # ── iOS (TestFlight upload; no file is attached to the GitHub Release) ───────
  ios:
    # Needs apps/ios/release.json to carry this fork's bundle identifier and team, plus the
    # signing secrets read by apps/ios/scripts/ci-testflight.sh. The project README asks for
    # Xcode 27.3 or later; set IOS_RUNNER / IOS_XCODE if the default image is too old.
    needs: [meta]
    if: ${{ vars.RELEASE_IOS == 'true' }}
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Select Xcode
        env:
          IOS_XCODE: ${{ vars.IOS_XCODE || 'Xcode_27.2.app' }}
        run: |
          sudo xcode-select -s "/Applications/$IOS_XCODE"
          xcodebuild -version
      - name: Refuse upstream identifiers, set a unique build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'apps/ios/release.json'
          release = json.load(open(path))
          assert release['bundleIdentifier'] != 'dev.openbot.mobile', 'apps/ios/release.json still has the upstream bundle identifier'
          release['buildNumber'] = os.environ['BUILD_NUMBER']
          json.dump(release, open(path, 'w'), indent=2)
          PY
          python3 apps/ios/scripts/generate-project.py
          python3 apps/ios/scripts/check-native-config.py
      - name: Archive, sign and upload to App Store Connect
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash apps/ios/scripts/ci-testflight.sh

  # ── Publish ──────────────────────────────────────────────────────────────────
  publish:
    needs: [meta, ci, verify-images, sign, desktop, macos, android, ios]
    if: >-
      ${{ !cancelled()
      && needs.meta.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
      && needs.ci.result == 'success'
      && needs.verify-images.result == 'success'
      && needs.sign.result == 'success'
      && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core
          path: artifacts/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: artifacts/android
      - name: Assemble the release files and checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release-files
          # Only these artifacts are release files; digests and the unsigned CLI build are not.
          for directory in artifacts/core artifacts/desktop-* artifacts/android; do
            [ -d "$directory" ] && cp -n "$directory"/* release-files/
          done
          cd release-files
          for required in aiteamos-compose.yaml aiteamos-compose.yaml.sigstore.json install.sh aiteamos-linux-x64.gz; do
            [ -f "$required" ] || { echo "Missing release file: $required" >&2; exit 1; }
          done
          desktop=(aiTeamOS-*-mac-* aiTeamOS-*-win-* aiTeamOS-*-linux-*)
          [ ${#desktop[@]} -gt 0 ] && sha256sum "${desktop[@]}" > DESKTOP_SHA256SUMS
          others=()
          for file in *; do
            case "$file" in
              SHA256SUMS|DESKTOP_SHA256SUMS|latest*.yml) continue ;;
            esac
            printf '%s\n' "${desktop[@]}" | grep -qxF -- "$file" || others+=("$file")
          done
          sha256sum "${others[@]}" > SHA256SUMS
          ls -l
      - name: Write the release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install the server

          \`\`\`sh
          curl -fsSL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sh
          \`\`\`

          On Windows PowerShell:

          \`\`\`powershell
          irm ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.ps1 | iex
          \`\`\`

          Desktop installers and the Android APK are attached below. Checksums are in
          \`SHA256SUMS\` and \`DESKTOP_SHA256SUMS\`; the Compose file and CLI binaries carry
          Sigstore signatures (\`*.sigstore.json\`). The source for this build is the tag
          \`${GITHUB_REF_NAME}\` of this repository (GPL-3.0-only).
          EOF
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        # Not marked as a pre-release: the installer, the CLI and the desktop updater all read
        # /releases/latest, which GitHub answers only with non-pre-release releases.
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "ai-TeamOS $VERSION" \
            --notes-file notes.md \
            --generate-notes
