name: Sync upstream main

# Keeps this fork's `main` an exact mirror of raghavpillai/openteam `main`.
# `main` never receives local commits; fork work lives on `teambots`.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          # Fails (instead of overwriting) if main has diverged from upstream.
          # A fine-grained PAT in UPSTREAM_SYNC_TOKEN is required when upstream
          # changed files under .github/workflows; github.token cannot push those.
          gh repo sync "${{ github.repository }}" --branch main --source raghavpillai/openteam
