<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: outcomego-staged: http: https:; connect-src 'self' http: https: ws: wss:; frame-src http: https:; font-src 'self' data:; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%232563eb%22/><circle cx=%2232%22 cy=%2232%22 r=%228%22 fill=%22white%22/></svg>" />
    <title>OutcomeGo</title>
    <style>
      :root { --outcomego-boot-background: #fbfbfb; --outcomego-boot-ink: #111111; }
      @media (prefers-color-scheme: dark) {
        :root { --outcomego-boot-background: #080808; --outcomego-boot-ink: #f5f5f5; }
      }
      :root[data-theme="light"] { --outcomego-boot-background: #fbfbfb; --outcomego-boot-ink: #111111; }
      :root[data-theme="dark"] { --outcomego-boot-background: #080808; --outcomego-boot-ink: #f5f5f5; }
      html, body { margin: 0; background: var(--outcomego-boot-background); }
      #outcomego-boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--outcomego-boot-background);
        color: var(--outcomego-boot-ink);
      }
      #outcomego-boot-shell > svg {
        opacity: 0;
        animation: outcomego-boot-reveal 300ms ease-out 180ms forwards;
      }
      #root:not(:empty) + #outcomego-boot-shell { display: none; }
      /* Signing in on a first run reloads into setup with #outcomego-setup-frame in the URL
         (first-run-shell.tsx). Until the app renders, the boot screen is then setup's frame
         instead of the logo, from the very first paint, so the window never blanks. */
      :root:has(#outcomego-setup-frame:target) {
        --outcomego-boot-background: #ffffff;
        --outcomego-boot-ink: #111113;
        --outcomego-boot-line: rgb(17 17 19 / 10%);
        --outcomego-boot-stage: radial-gradient(circle at 50% 42%, #dfe8f8, transparent 62%), #edf2fb;
        --outcomego-boot-panel: clamp(400px, 40vw, 500px);
      }
      @media (prefers-color-scheme: dark) {
        :root:has(#outcomego-setup-frame:target):not([data-theme="light"]) {
          --outcomego-boot-background: #121214;
          --outcomego-boot-ink: #f4f4f6;
          --outcomego-boot-line: rgb(255 255 255 / 10%);
          --outcomego-boot-stage: radial-gradient(circle at 50% 42%, #172338, transparent 62%), #111a29;
        }
      }
      :root:has(#outcomego-setup-frame:target)[data-theme="dark"] {
        --outcomego-boot-background: #121214;
        --outcomego-boot-ink: #f4f4f6;
        --outcomego-boot-line: rgb(255 255 255 / 10%);
        --outcomego-boot-stage: radial-gradient(circle at 50% 42%, #172338, transparent 62%), #111a29;
      }
      :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell > svg { display: none; }
      :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell::before {
        position: absolute;
        inset: 0 0 0 var(--outcomego-boot-panel);
        background: var(--outcomego-boot-stage);
        box-shadow: -1px 0 0 var(--outcomego-boot-line);
        content: "";
      }
      /* The progress bar on its first step: four segments 6 px apart. */
      :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell::after {
        position: absolute;
        top: 56px;
        left: 48px;
        width: calc(var(--outcomego-boot-panel) - 96px);
        height: 4px;
        background: linear-gradient(90deg, var(--outcomego-boot-ink) 0 calc(25% - 4.5px), transparent 0 calc(25% + 1.5px), var(--outcomego-boot-line) 0 calc(50% - 3px), transparent 0 calc(50% + 3px), var(--outcomego-boot-line) 0 calc(75% - 1.5px), transparent 0 calc(75% + 4.5px), var(--outcomego-boot-line) 0);
        content: "";
      }
      @media (max-width: 860px) {
        :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell::before { display: none; }
        :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell::after { left: max(48px, calc(50% - 220px)); width: min(440px, calc(100% - 96px)); }
      }
      @media (max-height: 640px) {
        :root:has(#outcomego-setup-frame:target) #outcomego-boot-shell::after { top: 32px; }
      }
      @keyframes outcomego-boot-reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #outcomego-boot-shell > svg { opacity: 1; animation: none; }
      }
    </style>
    <script type="module" src="/src/renderer/boot-theme.ts"></script>
  </head>
  <body>
    <i hidden id="outcomego-setup-frame"></i>
    <div id="root"></div>
    <div id="outcomego-boot-shell" aria-hidden="true">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 2.8C10.4 3.5 5.1 7 2.3 12 .5 16.5.5 23.8 2.8 27.5 5 32 10.5 34.5 16.5 36.3c4.2 1.05 9.5 1.05 13.5-.2 5.8-2.4 7.6-7 8.4-11.4C39.1 19 36.5 12 32.5 7.5 30.3 3 25 1.5 15 2.8Z" fill="currentColor" />
        <g fill="var(--outcomego-boot-background)">
          <rect height="6.4" rx="1.875" transform="rotate(-16 21.05 15.8)" width="3.75" x="19.075" y="12.6" />
          <rect height="6.4" rx="1.45" transform="rotate(-16 31.7 14.5)" width="2.9" x="30.25" y="11.3" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
